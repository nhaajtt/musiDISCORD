x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

# Shared configuration for every bot. The main bot is "bot"; bot2 and bot3 only run with --profile multi
x-bot: &bot
  build: .
  image: musidiscord-bot:local
  restart: unless-stopped
  logging: *logging
  depends_on:
    lavalink:
      condition: service_healthy

services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: musidiscord-lavalink
    restart: unless-stopped
    logging: *logging
    environment:
      - _JAVA_OPTIONS=-Xmx512M
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
      - ./lavalink/plugins:/opt/Lavalink/plugins
      - ./music:/music:ro
    expose:
      - "2333"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H \"Authorization: $$LAVALINK_PASSWORD\" http://localhost:2333/version >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s

  # --- Second Lavalink for failover: docker compose --profile ha up -d --build ---
  # Then set LAVALINK_NODES=main=lavalink:2333,backup=lavalink2:2333 in .env (both use LAVALINK_PASSWORD).
  # When one node goes down the bot moves its players to the other. Both nodes read the same ./music folder.
  lavalink2:
    image: ghcr.io/lavalink-devs/lavalink:4
    profiles: ["ha"]
    container_name: musidiscord-lavalink2
    restart: unless-stopped
    logging: *logging
    environment:
      - _JAVA_OPTIONS=-Xmx512M
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
      - ./lavalink/plugins2:/opt/Lavalink/plugins
      - ./music:/music:ro
    expose:
      - "2333"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H \"Authorization: $$LAVALINK_PASSWORD\" http://localhost:2333/version >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s

  bot:
    <<: *bot
    container_name: musidiscord-bot
    env_file: .env
    environment:
      - LAVALINK_HOST=lavalink
      - SHARED_DIR=/app/shared
      - DISPLAY_BIND=0.0.0.0
    ports:
      # The /display status page is only exposed on the machine running the bot (enable with DISPLAY_PORT=8787 in .env)
      - "127.0.0.1:8787:8787"
    volumes:
      - ./music:/music
      - ./data:/app/data
      - ./data/shared:/app/shared

  # --- Multiple bots at once: docker compose --profile multi up -d --build ---
  # Each bot has its own token (.env.bot2) and they share Lavalink and the music folder; data is separate, while tags/audio features are shared.
  bot2:
    <<: *bot
    profiles: ["multi"]
    container_name: musidiscord-bot2
    env_file: .env.bot2
    environment:
      - LAVALINK_HOST=lavalink
      - SHARED_DIR=/app/shared
      - LIBRARY_WORKER=off
      - DISPLAY_BIND=0.0.0.0
    ports:
      - "127.0.0.1:8788:8787"
    volumes:
      - ./music:/music
      - ./data/bot2:/app/data
      - ./data/shared:/app/shared

  bot3:
    <<: *bot
    profiles: ["multi"]
    container_name: musidiscord-bot3
    env_file: .env.bot3
    environment:
      - LAVALINK_HOST=lavalink
      - SHARED_DIR=/app/shared
      - LIBRARY_WORKER=off
      - DISPLAY_BIND=0.0.0.0
    ports:
      - "127.0.0.1:8789:8787"
    volumes:
      - ./music:/music
      - ./data/bot3:/app/data
      - ./data/shared:/app/shared

  # --- Monitoring: docker compose --profile ops up -d (open http://localhost:3001) ---
  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ["ops"]
    container_name: musidiscord-kuma
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data/kuma:/app/data
